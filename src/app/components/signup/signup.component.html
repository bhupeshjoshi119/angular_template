<div class="auth-container">
  <div class="auth-card">
    <!-- Logo/Icon -->
    <div class="logo-container">
      <div class="logo-icon">
        <svg width="40" height="40" viewBox="0 0 40 40" fill="none" xmlns="http://www.w3.org/2000/svg">
          <rect width="40" height="40" rx="12" fill="#4F46E5"/>
          <path d="M20 12C16.134 12 13 15.134 13 19V21C13 21.552 13.448 22 14 22H26C26.552 22 27 21.552 27 21V19C27 15.134 23.866 12 20 12Z" fill="white"/>
          <path d="M14 23C13.448 23 13 23.448 13 24V26C13 26.552 13.448 27 14 27H26C26.552 27 27 26.552 27 26V24C27 23.448 26.552 23 26 23H14Z" fill="white"/>
        </svg>
      </div>
    </div>

    <!-- Header -->
    <div class="auth-header">
      <h1>Create Your Account</h1>
      <p class="subtitle">Let's get you started with your new account.</p>
    </div>

    <!-- Signup Form -->
    <form class="auth-form" (ngSubmit)="onSignup()">
      <!-- Full Name Field -->
      <div class="form-group">
        <label for="fullName">Full Name</label>
        <input
          type="text"
          id="fullName"
          name="fullName"
          [(ngModel)]="fullName"
          placeholder="Enter your full name"
          required
          autocomplete="name"
        />
      </div>

      <!-- Email Field -->
      <div class="form-group">
        <label for="email">Email Address</label>
        <input
          type="email"
          id="email"
          name="email"
          [(ngModel)]="email"
          placeholder="Enter your email address"
          required
          autocomplete="email"
        />
      </div>

      <!-- Password Field -->
      <div class="form-group">
        <label for="password">Password</label>
        <div class="password-input-wrapper">
          <input
            [type]="showPassword ? 'text' : 'password'"
            id="password"
            name="password"
            [(ngModel)]="password"
            placeholder="Enter your password"
            required
            autocomplete="new-password"
            (input)="checkPasswordStrength()"
          />
          <button
            type="button"
            class="password-toggle"
            (click)="togglePasswordVisibility()"
            aria-label="Toggle password visibility"
          >
            <svg *ngIf="!showPassword" width="20" height="20" viewBox="0 0 20 20" fill="none">
              <path d="M10 4C4.5 4 2 10 2 10s2.5 6 8 6 8-6 8-6-2.5-6-8-6z" stroke="#9CA3AF" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
              <circle cx="10" cy="10" r="2.5" stroke="#9CA3AF" stroke-width="1.5"/>
            </svg>
            <svg *ngIf="showPassword" width="20" height="20" viewBox="0 0 20 20" fill="none">
              <path d="M3 3l14 14M10 7a3 3 0 013 3m-6 0a3 3 0 003-3m-3 3v3" stroke="#9CA3AF" stroke-width="1.5" stroke-linecap="round"/>
            </svg>
          </button>
        </div>
        <p class="password-hint">Must be 8+ characters, include a number and a symbol.</p>
      </div>

      <!-- Confirm Password Field -->
      <div class="form-group">
        <label for="confirmPassword">Confirm Password</label>
        <div class="password-input-wrapper">
          <input
            [type]="showConfirmPassword ? 'text' : 'password'"
            id="confirmPassword"
            name="confirmPassword"
            [(ngModel)]="confirmPassword"
            placeholder="Confirm your password"
            required
            autocomplete="new-password"
            (input)="checkPasswordMatch()"
          />
          <button
            type="button"
            class="password-toggle"
            (click)="toggleConfirmPasswordVisibility()"
            aria-label="Toggle confirm password visibility"
          >
            <svg *ngIf="!showConfirmPassword" width="20" height="20" viewBox="0 0 20 20" fill="none">
              <path d="M10 4C4.5 4 2 10 2 10s2.5 6 8 6 8-6 8-6-2.5-6-8-6z" stroke="#9CA3AF" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
              <circle cx="10" cy="10" r="2.5" stroke="#9CA3AF" stroke-width="1.5"/>
            </svg>
            <svg *ngIf="showConfirmPassword" width="20" height="20" viewBox="0 0 20 20" fill="none">
              <path d="M3 3l14 14M10 7a3 3 0 013 3m-6 0a3 3 0 003-3m-3 3v3" stroke="#9CA3AF" stroke-width="1.5" stroke-linecap="round"/>
            </svg>
          </button>
        </div>
        <p *ngIf="passwordMismatch && confirmPassword" class="error-message">Passwords do not match</p>
      </div>

      <!-- Sign Up Button -->
      <button type="submit" class="btn btn-primary" [disabled]="isLoading || !isFormValid()">
        <span *ngIf="!isLoading">Sign Up</span>
        <span *ngIf="isLoading" class="spinner"></span>
      </button>
    </form>

    <!-- Login Link -->
    <div class="auth-footer">
      <p>Already have an account? <a routerLink="/login" class="link">Log In</a></p>
    </div>
  </div>
</div>
