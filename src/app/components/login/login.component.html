<div class="auth-container">
  <div class="auth-card">
    <!-- Logo/Icon -->
    <div class="logo-container">
      <div class="logo-icon">
        <svg width="40" height="40" viewBox="0 0 40 40" fill="none" xmlns="http://www.w3.org/2000/svg">
          <rect width="40" height="40" rx="12" fill="#4F46E5"/>
          <path d="M20 12C16.134 12 13 15.134 13 19V21C13 21.552 13.448 22 14 22H26C26.552 22 27 21.552 27 21V19C27 15.134 23.866 12 20 12Z" fill="white"/>
          <path d="M14 23C13.448 23 13 23.448 13 24V26C13 26.552 13.448 27 14 27H26C26.552 27 27 26.552 27 26V24C27 23.448 26.552 23 26 23H14Z" fill="white"/>
        </svg>
      </div>
    </div>

    <!-- Header -->
    <div class="auth-header">
      <h1>Welcome Back!</h1>
      <p class="subtitle">Log in to start your shopping journey.</p>
    </div>

    <!-- Login Form -->
    <form class="auth-form" (ngSubmit)="onLogin()">
      <!-- Email Field -->
      <div class="form-group">
        <label for="email">Email Address</label>
        <input
          type="email"
          id="email"
          name="email"
          [(ngModel)]="email"
          placeholder="Enter your email"
          required
          autocomplete="email"
        />
      </div>

      <!-- Password Field -->
      <div class="form-group">
        <label for="password">Password</label>
        <div class="password-input-wrapper">
          <input
            [type]="showPassword ? 'text' : 'password'"
            id="password"
            name="password"
            [(ngModel)]="password"
            placeholder="Enter your password"
            required
            autocomplete="current-password"
          />
          <button
            type="button"
            class="password-toggle"
            (click)="togglePasswordVisibility()"
            aria-label="Toggle password visibility"
          >
            <svg *ngIf="!showPassword" width="20" height="20" viewBox="0 0 20 20" fill="none">
              <path d="M10 4C4.5 4 2 10 2 10s2.5 6 8 6 8-6 8-6-2.5-6-8-6z" stroke="#9CA3AF" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
              <circle cx="10" cy="10" r="2.5" stroke="#9CA3AF" stroke-width="1.5"/>
            </svg>
            <svg *ngIf="showPassword" width="20" height="20" viewBox="0 0 20 20" fill="none">
              <path d="M3 3l14 14M10 7a3 3 0 013 3m-6 0a3 3 0 003-3m-3 3v3" stroke="#9CA3AF" stroke-width="1.5" stroke-linecap="round"/>
            </svg>
          </button>
        </div>
      </div>

      <!-- Forgot Password Link -->
      <div class="forgot-password">
        <a href="#" class="link">Forgot Password?</a>
      </div>

      <!-- Login Button -->
      <button type="submit" class="btn btn-primary" [disabled]="isLoading">
        <span *ngIf="!isLoading">Login</span>
        <span *ngIf="isLoading" class="spinner"></span>
      </button>

      <!-- Divider -->
      <div class="divider">
        <span>OR</span>
      </div>

      <!-- Social Login Buttons -->
      <button type="button" class="btn btn-social btn-google" (click)="onGoogleLogin()">
        <svg width="20" height="20" viewBox="0 0 20 20" fill="none">
          <path d="M19.6 10.227c0-.709-.064-1.39-.182-2.045H10v3.868h5.382a4.6 4.6 0 01-1.996 3.018v2.51h3.232c1.891-1.742 2.982-4.305 2.982-7.35z" fill="#4285F4"/>
          <path d="M10 20c2.7 0 4.964-.895 6.618-2.423l-3.232-2.509c-.895.6-2.04.955-3.386.955-2.605 0-4.81-1.76-5.595-4.123H1.064v2.59A9.996 9.996 0 0010 20z" fill="#34A853"/>
          <path d="M4.405 11.9c-.2-.6-.314-1.24-.314-1.9 0-.66.114-1.3.314-1.9V5.51H1.064A9.996 9.996 0 000 10c0 1.614.386 3.14 1.064 4.49l3.34-2.59z" fill="#FBBC05"/>
          <path d="M10 3.977c1.468 0 2.786.505 3.823 1.496l2.868-2.868C14.959.99 12.695 0 10 0 6.09 0 2.71 2.24 1.064 5.51l3.34 2.59C5.19 5.736 7.395 3.977 10 3.977z" fill="#EA4335"/>
        </svg>
        Continue with Google
      </button>

      <button type="button" class="btn btn-social btn-apple" (click)="onAppleLogin()">
        <svg width="20" height="20" viewBox="0 0 20 20" fill="none">
          <path d="M15.5 17.5c-.9 1.2-1.9 2.4-3.4 2.4-1.4 0-1.9-.9-3.5-.9-1.6 0-2.2.9-3.5.9-1.5 0-2.6-1.4-3.6-2.7C-.1 15.3-.5 12.5.4 10.2c.6-1.5 2-2.5 3.5-2.5 1.5 0 2.4.9 3.6.9 1.1 0 1.8-.9 3.4-.9 1.2 0 2.3.7 3.1 1.8-2.7 1.5-2.3 5.4.5 6.5-.5 1.2-1.1 2.3-2 3.5zM13 3.5c.7-.9 1.2-2.1 1-3.5-1.2.1-2.6.8-3.4 1.8-.7.8-1.3 2.1-1.1 3.3 1.3.1 2.7-.6 3.5-1.6z" fill="currentColor"/>
        </svg>
        Continue with Apple
      </button>
    </form>

    <!-- Sign Up Link -->
    <div class="auth-footer">
      <p>Don't have an account? <a routerLink="/signup" class="link">Sign Up</a></p>
    </div>
  </div>
</div>
